  os: "Arch Linux, Android, macOS"     # "OS:" line
  kernel: "Techlead Backend / DevOps"  # "Kernel:" line (your role)
  ide: "VSCode"                        # "IDE:" line
  languages_human: "Portuguese, English"
  instagram: "itismejao"
  born: "2019-01-01"                    # start date used for "Uptime:" (YYYY-MM-DD)
  prompt: "neofetch --ascii"

# Language display settings
languages:
  exclude:                     # Languages to hide from the telemetry chart
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8               # Maximum number of languages to show
