<svg xmlns="http://www.w3.org/2000/svg" width="330" height="92" viewBox="0 0 330 92">
  <defs>
    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.5; } }
      .beacon { animation: beacon 2.2s ease-in-out infinite; }
      @keyframes beacon { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      .chip:hover .plate { stroke-opacity: 0.9; }
    </style>
    <clipPath id="clip-github">
      <rect x="1" y="1" width="328" height="90" rx="14" ry="14"/>
    </clipPath>
    <radialGradient id="node-github" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f3f8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0f3f8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g class="chip">
    <rect x="1" y="1" width="328" height="90" rx="14" ry="14"
          fill="#080c14" stroke="#1a2332" stroke-width="1"/>
    <g clip-path="url(#clip-github)">
    <circle cx="101.3" cy="63.1" r="0.46" fill="#ffffff" opacity="0.41" class="tw" style="animation-delay:0.5s"/>
    <circle cx="253.7" cy="39.2" r="1.00" fill="#ffffff" opacity="0.19" class="tw" style="animation-delay:0.4s"/>
    <circle cx="32.7" cy="36.1" r="0.64" fill="#ffffff" opacity="0.37" class="tw" style="animation-delay:1.0s"/>
    <circle cx="76.2" cy="57.4" r="0.44" fill="#ffffff" opacity="0.31" class="tw" style="animation-delay:0.5s"/>
    <circle cx="151.4" cy="19.9" r="0.97" fill="#ffffff" opacity="0.39" class="tw" style="animation-delay:0.1s"/>
    <circle cx="91.6" cy="30.4" r="0.35" fill="#ffffff" opacity="0.27" class="tw" style="animation-delay:0.5s"/>
    <circle cx="9.6" cy="28.8" r="0.71" fill="#ffffff" opacity="0.15" class="tw" style="animation-delay:0.2s"/>
    <circle cx="22.6" cy="76.3" r="0.40" fill="#ffffff" opacity="0.34" class="tw" style="animation-delay:0.8s"/>
    <circle cx="184.7" cy="14.0" r="0.70" fill="#ffffff" opacity="0.42" class="tw" style="animation-delay:0.8s"/>
    <circle cx="188.2" cy="60.0" r="0.80" fill="#ffffff" opacity="0.37" class="tw" style="animation-delay:1.2s"/>
    <circle cx="263.4" cy="6.6" r="0.71" fill="#ffffff" opacity="0.21" class="tw" style="animation-delay:0.7s"/>
    <circle cx="232.7" cy="33.6" r="0.95" fill="#ffffff" opacity="0.23" class="tw" style="animation-delay:0.1s"/>
    <circle cx="36.1" cy="45.2" r="0.61" fill="#ffffff" opacity="0.31" class="tw" style="animation-delay:0.9s"/>
    <circle cx="305.8" cy="16.1" r="0.57" fill="#ffffff" opacity="0.43" class="tw" style="animation-delay:0.4s"/>
    <circle cx="181.1" cy="26.0" r="0.87" fill="#ffffff" opacity="0.21" class="tw" style="animation-delay:0.5s"/>
    <circle cx="202.7" cy="8.9" r="0.47" fill="#ffffff" opacity="0.28" class="tw" style="animation-delay:0.1s"/>
      <rect class="plate" x="1" y="1" width="328" height="90" rx="14" ry="14"
            fill="none" stroke="#f0f3f8" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="1" y="1" width="5" height="90" fill="#f0f3f8" opacity="0.55"/>
    </g>

    <!-- signal node -->
    <circle cx="48" cy="46" r="26" fill="url(#node-github)"/>
    <circle cx="48" cy="46" r="20" fill="#0f1623" stroke="#f0f3f8" stroke-width="1.2" opacity="0.9"/>
    <svg x="36" y="34" width="24" height="24" viewBox="0 0 24 24" fill="#f0f3f8"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.731.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.960-1.32.47-2.39 1.24-3.23-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 016 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.23 0 4.63-2.81 5.65-5.49 5.95.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58A12 12 0 0024 12.5C24 5.87 18.63.5 12 .5z"/></svg>

    <!-- beacon -->
    <circle class="beacon" cx="312" cy="18" r="3" fill="#f0f3f8"/>

    <!-- text -->
    <text x="86" y="38" fill="#f0f3f8" font-size="16" font-weight="bold" font-family="monospace">GitHub</text>
    <text x="86" y="57" fill="#f1f5f9" font-size="12" font-family="monospace">@itismejao</text>
    <text x="86" y="74" fill="#64748b" font-size="10" font-family="monospace" font-style="italic">home base &#183; you are here</text>
  </g>
</svg>