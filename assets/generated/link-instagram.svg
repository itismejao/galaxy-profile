<svg xmlns="http://www.w3.org/2000/svg" width="330" height="92" viewBox="0 0 330 92">
  <defs>
    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.5; } }
      .beacon { animation: beacon 2.2s ease-in-out infinite; }
      @keyframes beacon { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      .chip:hover .plate { stroke-opacity: 0.9; }
    </style>
    <clipPath id="clip-instagram">
      <rect x="1" y="1" width="328" height="90" rx="14" ry="14"/>
    </clipPath>
    <radialGradient id="node-instagram" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d3d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9d3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g class="chip">
    <rect x="1" y="1" width="328" height="90" rx="14" ry="14"
          fill="#080c14" stroke="#1a2332" stroke-width="1"/>
    <g clip-path="url(#clip-instagram)">
    <circle cx="176.2" cy="38.0" r="0.46" fill="#ffffff" opacity="0.25" class="tw" style="animation-delay:0.8s"/>
    <circle cx="289.6" cy="83.0" r="0.78" fill="#ffffff" opacity="0.32" class="tw" style="animation-delay:1.1s"/>
    <circle cx="237.4" cy="29.3" r="0.44" fill="#ffffff" opacity="0.14" class="tw" style="animation-delay:0.0s"/>
    <circle cx="16.1" cy="42.8" r="0.72" fill="#ffffff" opacity="0.33" class="tw" style="animation-delay:0.2s"/>
    <circle cx="77.5" cy="82.3" r="0.44" fill="#ffffff" opacity="0.21" class="tw" style="animation-delay:0.7s"/>
    <circle cx="180.5" cy="37.8" r="0.74" fill="#ffffff" opacity="0.40" class="tw" style="animation-delay:0.5s"/>
    <circle cx="122.0" cy="63.7" r="0.94" fill="#ffffff" opacity="0.17" class="tw" style="animation-delay:0.8s"/>
    <circle cx="168.5" cy="38.7" r="0.84" fill="#ffffff" opacity="0.45" class="tw" style="animation-delay:0.3s"/>
    <circle cx="218.0" cy="24.7" r="0.52" fill="#ffffff" opacity="0.23" class="tw" style="animation-delay:1.0s"/>
    <circle cx="259.4" cy="16.2" r="0.81" fill="#ffffff" opacity="0.11" class="tw" style="animation-delay:1.0s"/>
    <circle cx="57.1" cy="41.0" r="0.52" fill="#ffffff" opacity="0.34" class="tw" style="animation-delay:0.2s"/>
    <circle cx="264.2" cy="15.7" r="0.96" fill="#ffffff" opacity="0.29" class="tw" style="animation-delay:1.1s"/>
    <circle cx="109.9" cy="8.7" r="0.54" fill="#ffffff" opacity="0.21" class="tw" style="animation-delay:0.4s"/>
    <circle cx="262.0" cy="14.9" r="0.39" fill="#ffffff" opacity="0.19" class="tw" style="animation-delay:0.5s"/>
    <circle cx="177.6" cy="69.4" r="0.52" fill="#ffffff" opacity="0.18" class="tw" style="animation-delay:1.0s"/>
    <circle cx="31.4" cy="54.1" r="0.97" fill="#ffffff" opacity="0.30" class="tw" style="animation-delay:0.6s"/>
      <rect class="plate" x="1" y="1" width="328" height="90" rx="14" ry="14"
            fill="none" stroke="#ff9d3d" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="1" y="1" width="5" height="90" fill="#ff9d3d" opacity="0.55"/>
    </g>

    <!-- signal node -->
    <circle cx="48" cy="46" r="26" fill="url(#node-instagram)"/>
    <circle cx="48" cy="46" r="20" fill="#0f1623" stroke="#ff9d3d" stroke-width="1.2" opacity="0.9"/>
