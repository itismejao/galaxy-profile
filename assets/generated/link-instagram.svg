    <!-- beacon -->
    <circle class="beacon" cx="312" cy="18" r="3" fill="#ff9d3d"/>

    <!-- text -->
    <text x="86" y="38" fill="#ff9d3d" font-size="16" font-weight="bold" font-family="monospace">Instagram</text>
    <text x="86" y="57" fill="#f1f5f9" font-size="12" font-family="monospace">@itismejao</text>
    <text x="86" y="74" fill="#64748b" font-size="10" font-family="monospace" font-style="italic">daily transmissions</text>
  </g>
